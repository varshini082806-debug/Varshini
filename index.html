<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formspree URL Test</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            background: #4285f4;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3367d6;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Formspree URL Test</h1>

        <form
            action="https://formspree.io/f/xnpnajpe"
            method="POST">

            <input
                type="url"
                name="submitted_url"
                value="https://example.com"
                placeholder="Enter URL"
                required>

            <button type="submit">
                Submit
            </button>

        </form>

    </div>

</body>
</html>
