<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>URL Submit</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 0 22px;
            font-size: 16px;
            border: 1px solid #d9d9d9;
            border-radius: 28px;
            outline: none;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.15);
        }

        input:focus {
            box-shadow: 0 1px 8px rgba(32, 33, 36, 0.25);
        }

        button {
            margin-top: 25px;
            padding: 12px 28px;
            border: none;
            border-radius: 5px;
            background: #4285f4;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #3367d6;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>URL Submit</h1>

        <!--
            IMPORTANT:
            Replace the URL below with YOUR REAL Formspree endpoint.
        -->

        <form
            action="https://formspree.io/f/YOUR_FORM_ID"
            method="POST">

            <input
                type="url"
                name="submitted_url"
                value="https://example.com"
                placeholder="Enter URL"
                required>

            <button type="submit">
                Submit
            </button>

        </form>

    </div>

</body>
