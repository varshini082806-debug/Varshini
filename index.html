```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formspree Submission</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
            color: #222;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Formspree Submission</h1>

        <input
            type="url"
            id="formUrl"
            placeholder="Paste Formspree URL here"
            required
        >

        <button onclick="openFormspree()">
            Open Submission
        </button>

        <p id="message"></p>

    </div>

    <script>
        function openFormspree() {

            const url = document.getElementById("formUrl").value.trim();
            const message = document.getElementById("message");

            if (url === "") {
                message.textContent = "Please enter a URL.";
                message.style.color = "red";
                return;
            }

            try {
                const validUrl = new URL(url);

                if (validUrl.protocol !== "https:") {
                    message.textContent = "Please enter a valid HTTPS URL.";
                    message.style.color = "red";
                    return;
                }

                message.textContent = "Opening Formspree...";
                message.style.color = "green";

                window.open(validUrl.href, "_blank");

            } catch (error) {
                message.textContent = "Please enter a valid URL.";
                message.style.color = "red";
            }
        }
    </script>

</body>
</html>
